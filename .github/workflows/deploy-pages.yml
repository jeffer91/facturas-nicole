name: Publicar Facturas Nicole
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Subir web
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
